<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Page Not Found | Yomin Electric</title>
<meta name="description" content="The page you are looking for could not be found.">
<link rel="canonical" href="https://www.yominelectric.com/404.html">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root{--bg:#0d0d0d;--bgs:#141414;--bgc:#181818;--bdr:rgba(255,255,255,.08);--tx:#f0ede8;--mt:#888;--ac:#E8944A;--ac2:#F2A968;--sf:Georgia,serif;--ss:'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--ss);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.code{font-family:var(--sf);font-size:clamp(80px,18vw,160px);line-height:1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h1{font-family:var(--sf);font-size:clamp(22px,4vw,34px);margin-bottom:12px}
p{color:var(--mt);font-size:14px;line-height:1.7;max-width:480px;margin-bottom:28px}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
a.btn{background:var(--ac);color:#000;text-decoration:none;padding:12px 26px;border-radius:10px;font-size:14px;font-weight:600;transition:background .2s}
a.btn:hover{background:var(--ac2)}
a.ghost{color:var(--mt);text-decoration:none;padding:12px 26px;border:1px solid var(--bdr);border-radius:10px;font-size:14px;transition:color .2s,border-color .2s}
a.ghost:hover{color:var(--tx);border-color:var(--ac)}
</style>
</head>
<body>
<div class="code">404</div>
<h1>Page Not Found</h1>
<p>Sorry, the page you are looking for doesn't exist, may have been moved, or the link is outdated. Try one of these instead:</p>
<div class="links">
  <a class="btn" href="/">Home</a>
  <a class="ghost" href="/products">Products</a>
  <a class="ghost" href="/blog">Blog</a>
  <a class="ghost" href="/contact">Contact</a>
</div>
</body>
</html>
